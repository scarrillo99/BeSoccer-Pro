# Coeficientes de fuerza de liga.
#
# QUE ES: factor de traduccion entre competiciones. Un 85 en Eredivisie no
# vale lo mismo que un 85 en Premier; el coeficiente convierte el percentil
# dentro de la liga a una escala comun para poder cruzar paises.
#
# COMO SE USA:  nivel_absoluto = percentil_en_su_liga * coeficiente
#
# IMPORTANTE: estos valores son una LINEA BASE EDITABLE, no un dato oficial.
# Estan puestos a ojo siguiendo el orden habitual de ranking UEFA / valor de
# plantilla. Ajustalos con vuestro propio criterio de scouting: es el unico
# parametro del modelo con juicio subjetivo dentro, y cambia los resultados.
#
# Las claves se comparan en minusculas y sin acentos. Anade los alias con los
# que salga cada liga en vuestro export.

default: 0.70   # liga no reconocida -> se asume nivel medio-bajo, y se avisa

